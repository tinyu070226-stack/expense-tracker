<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cover Gradient (Nordique Fjord Blue) -->
    <linearGradient id="cover-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Paper Sheet Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Metallic Spiral Ring Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Vibrant Income/Expense Gradients -->
    <linearGradient id="income-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="expense-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="ring-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Icon Background (iOS Squircle shape) -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" />

  <!-- Outer Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="#0284c7" opacity="0.15" filter="blur(40px)" />

  <!-- Main Ledger Notebook Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- Back Cover (Nordique Fjord Blue Shadow) -->
    <rect x="115" y="80" width="310" height="352" rx="24" fill="url(#cover-grad)" />

    <!-- Inner Paper Sheet -->
    <rect x="135" y="94" width="275" height="324" rx="16" fill="url(#paper-grad)" />

    <!-- Ledger Grid Headers & Lines -->
    <!-- Top Header Bar -->
    <rect x="155" y="120" width="235" height="32" rx="6" fill="rgba(2, 132, 199, 0.12)" />
    <rect x="165" y="130" width="40" height="12" rx="3" fill="#0284c7" opacity="0.8" />
    <rect x="225" y="130" width="55" height="12" rx="3" fill="#64748b" opacity="0.6" />
    <rect x="300" y="130" width="45" height="12" rx="3" fill="#10b981" />
    <rect x="355" y="130" width="25" height="12" rx="3" fill="#f43f5e" />

    <!-- Horizontal Ledger Rows -->
    <line x1="155" y1="172" x2="390" y2="172" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="4 4" />
    <line x1="155" y1="212" x2="390" y2="212" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="4 4" />
    <line x1="155" y1="252" x2="390" y2="252" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="4 4" />
    <line x1="155" y1="292" x2="390" y2="292" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="4 4" />
    <line x1="155" y1="332" x2="390" y2="332" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="4 4" />

    <!-- Vertical Column Grid Dividers -->
    <line x1="215" y1="120" x2="215" y2="350" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="290" y1="120" x2="290" y2="350" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="345" y1="120" x2="345" y2="350" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Sample Colorful Transaction Pills on Ledger -->
    <!-- Income Pill (+$) -->
    <rect x="298" y="185" width="40" height="14" rx="4" fill="url(#income-grad)" />
    <rect x="352" y="225" width="32" height="14" rx="4" fill="url(#expense-grad)" />
    <rect x="298" y="265" width="40" height="14" rx="4" fill="url(#income-grad)" />

    <!-- Total Summary Box at Bottom -->
    <rect x="155" y="360" width="235" height="42" rx="10" fill="#0f172a" />
    <circle cx="180" cy="381" r="10" fill="#38bdf8" opacity="0.2" />
    <rect x="200" y="375" width="70" height="12" rx="3" fill="#ffffff" />
    <rect x="310" y="373" width="65" height="16" rx="4" fill="#38bdf8" />

    <!-- Metallic Spiral Wire Coil Loops on Left Edge -->
    <!-- Punch Holes -->
    <circle cx="125" cy="115" r="8" fill="#475569" />
    <circle cx="125" cy="155" r="8" fill="#475569" />
    <circle cx="125" cy="195" r="8" fill="#475569" />
    <circle cx="125" cy="235" r="8" fill="#475569" />
    <circle cx="125" cy="275" r="8" fill="#475569" />
    <circle cx="125" cy="315" r="8" fill="#475569" />
    <circle cx="125" cy="355" r="8" fill="#475569" />
    <circle cx="125" cy="395" r="8" fill="#475569" />

    <!-- Metallic Coils (3D Silver Ring Loops) -->
    <g filter="url(#ring-shadow)">
      <path d="M 95 105 C 80 115, 80 125, 130 115" fill="none" stroke="url(#metal-grad)" stroke-width="9" stroke-linecap="round" />
      <path d="M 95 145 C 80 155, 80 165, 130 155" fill="none" stroke="url(#metal-grad)" stroke-width="9" stroke-linecap="round" />
      <path d="M 95 185 C 80 195, 80 205, 130 195" fill="none" stroke="url(#metal-grad)" stroke-width="9" stroke-linecap="round" />
      <path d="M 95 225 C 80 235, 80 245, 130 235" fill="none" stroke="url(#metal-grad)" stroke-width="9" stroke-linecap="round" />
      <path d="M 95 265 C 80 275, 80 285, 130 275" fill="none" stroke="url(#metal-grad)" stroke-width="9" stroke-linecap="round" />
      <path d="M 95 305 C 80 315, 80 325, 130 315" fill="none" stroke="url(#metal-grad)" stroke-width="9" stroke-linecap="round" />
      <path d="M 95 345 C 80 355, 80 365, 130 355" fill="none" stroke="url(#metal-grad)" stroke-width="9" stroke-linecap="round" />
      <path d="M 95 385 C 80 395, 80 405, 130 395" fill="none" stroke="url(#metal-grad)" stroke-width="9" stroke-linecap="round" />
    </g>
  </g>
</svg>