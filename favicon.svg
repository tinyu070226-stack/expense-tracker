<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Polar Night) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Cover Plane Gradient (Nordique Fjord Blue) -->
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Metallic Wire Coil Gradient -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Base iOS Squircle Frame (面) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Geometric Minimalist Notebook Composition (點·線·面) -->
  <g transform="translate(10, 0)">
    <!-- Cover Base Plane (面) -->
    <rect x="110" y="80" width="315" height="352" rx="28" fill="url(#cover)" />

    <!-- White Paper Inner Plane (面) -->
    <rect x="132" y="94" width="278" height="324" rx="20" fill="#ffffff" />

    <!-- Table Grid Lines (線) -->
    <!-- Header Divider Line -->
    <line x1="152" y1="150" x2="390" y2="150" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />

    <!-- Horizontal Ledger Rows (線) -->
    <line x1="152" y1="195" x2="390" y2="195" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="152" y1="240" x2="390" y2="240" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="152" y1="285" x2="390" y2="285" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <line x1="152" y1="330" x2="390" y2="330" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />

    <!-- Vertical Column Grid Dividers (線) -->
    <line x1="210" y1="114" x2="210" y2="350" stroke="#cbd5e1" stroke-width="2.5" />
    <line x1="295" y1="114" x2="295" y2="350" stroke="#cbd5e1" stroke-width="2.5" />
    <line x1="350" y1="114" x2="350" y2="350" stroke="#cbd5e1" stroke-width="2.5" />

    <!-- Geometric Points & Data Indicator Lines (點 & 線) -->
    <!-- Date / Abstract Lines -->
    <line x1="162" y1="130" x2="190" y2="130" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
    <line x1="162" y1="173" x2="195" y2="173" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="162" y1="218" x2="195" y2="218" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="162" y1="263" x2="195" y2="263" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Income Emerald Points & Bars (點 & 面) -->
    <circle cx="322" cy="173" r="8" fill="#10b981" />
    <circle cx="322" cy="263" r="8" fill="#10b981" />
    <rect x="306" y="212" width="32" height="12" rx="6" fill="#10b981" />

    <!-- Expense Coral Red Points & Bars (點 & 面) -->
    <circle cx="370" cy="218" r="8" fill="#f43f5e" />
    <rect x="356" y="167" width="28" height="12" rx="6" fill="#f43f5e" />
    <rect x="356" y="257" width="28" height="12" rx="6" fill="#f43f5e" />

    <!-- Bottom Summary Trapezoid Pill Bar (面 & 點) -->
    <rect x="152" y="362" width="238" height="38" rx="14" fill="#0f172a" />
    <circle cx="178" cy="381" r="7" fill="#38bdf8" />
    <line x1="196" y1="381" x2="250" y2="381" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="310" y1="381" x2="368" y2="381" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

    <!-- Minimalist Metallic Spiral Rings & Punch Dots (點 & 線) -->
    <!-- Punch Hole Dots (點) -->
    <circle cx="112" cy="120" r="7" fill="#334155" />
    <circle cx="112" cy="165" r="7" fill="#334155" />
    <circle cx="112" cy="210" r="7" fill="#334155" />
    <circle cx="112" cy="255" r="7" fill="#334155" />
    <circle cx="112" cy="300" r="7" fill="#334155" />
    <circle cx="112" cy="345" r="7" fill="#334155" />
    <circle cx="112" cy="390" r="7" fill="#334155" />

    <!-- Metal Spiral Coils (點與線極簡幾何環) -->
    <path d="M 86 112 C 76 112, 76 128, 118 120" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" />
    <path d="M 86 157 C 76 157, 76 173, 118 165" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" />
    <path d="M 86 202 C 76 202, 76 218, 118 210" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" />
    <path d="M 86 247 C 76 247, 76 263, 118 255" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" />
    <path d="M 86 292 C 76 292, 76 308, 118 300" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" />
    <path d="M 86 337 C 76 337, 76 353, 118 345" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" />
    <path d="M 86 382 C 76 382, 76 398, 118 390" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>